openapi: 3.0.0
info:
  title: 'Fire Extinguisher Management System API'
  version: 1.0.0
  description: 'RESTful microservices API for fire extinguisher registration, inspection scheduling, maintenance logging, authentication, and reporting.'
servers:
  -
    url: 'http://localhost:5000/api'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  -
    bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Auth
      security: []
      summary: 'Register a user'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, properties: {firstName: {type: string, example: Admin}, lastName: {type: string, example: User}, email: {type: string, example: admin@femcs.rw}, password: {type: string, example: Admin@1234}, role: {type: string, example: admin}}}}
  /auth/login:
    post:
      tags:
        - Auth
      security: []
      summary: 'Login and receive a JWT'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, properties: {email: {type: string, example: admin@femcs.rw}, password: {type: string, example: Admin@1234}}}}
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 'Logout the current user'
  /auth/validate:
    get:
      tags:
        - Auth
      summary: 'Validate the current JWT'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /auth/me:
    get:
      tags:
        - Auth
      summary: 'Get the current user profile'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /auth/profile:
    patch:
      tags:
        - Auth
      summary: 'Update the current user profile'
  /auth/forgot-password:
    post:
      tags:
        - Auth
      security: []
      summary: 'Request a password reset OTP'
  /auth/reset-password:
    post:
      tags:
        - Auth
      security: []
      summary: 'Reset password with OTP'
  /auth/change-password:
    post:
      tags:
        - Auth
      summary: 'Change the current password'
  /auth/users:
    get:
      tags:
        - Auth
      summary: 'List users'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
        -
          in: query
          name: search
          schema: {type: string}
          description: 'Search term'
  /extinguishers:
    get:
      tags:
        - Extinguishers
      summary: 'List extinguishers'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
        -
          in: query
          name: search
          schema: {type: string}
          description: 'Search term'
    post:
      tags:
        - Extinguishers
      summary: 'Register a fire extinguisher'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, properties: {serialNumber: {type: string, example: EXT-999}, type: {type: string, example: CO2}, weight: {type: string, example: 5kg}, locationId: {type: integer, example: 1}, manufactureDate: {type: string, example: '2023-01-01'}, expiryDate: {type: string, example: '2028-01-01'}}}}
  /extinguishers/stats:
    get:
      tags:
        - Extinguishers
      summary: 'Inventory statistics'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
        -
          in: query
          name: search
          schema: {type: string}
          description: 'Search term'
  '/extinguishers/{id}':
    get:
      tags:
        - Extinguishers
      summary: 'Get extinguisher details'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
        -
          in: query
          name: search
          schema: {type: string}
          description: 'Search term'
    put:
      tags:
        - Extinguishers
      summary: 'Update extinguisher details'
    delete:
      tags:
        - Extinguishers
      summary: 'Delete an extinguisher'
  /inspections:
    get:
      tags:
        - Inspections
      summary: 'List inspections'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
    post:
      tags:
        - Inspections
      summary: 'Schedule or record an inspection'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, properties: {extinguisherId: {type: integer, example: 1}, inspectorId: {type: integer, example: 1}, status: {type: string, example: passed}, notes: {type: string, example: 'Passed inspection.'}}}}
  /maintenance:
    get:
      tags:
        - Maintenance
      summary: 'List maintenance records'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
    post:
      tags:
        - Maintenance
      summary: 'Create a maintenance record'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, properties: {extinguisherId: {type: integer, example: 1}, actionTaken: {type: string, example: Refilled}, performedBy: {type: integer, example: 1}, cost: {type: number, example: 50}}}}
  /reports/expired:
    get:
      tags:
        - Reports
      summary: 'Expired extinguishers report'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/expiring-soon:
    get:
      tags:
        - Reports
      summary: 'Upcoming expirations report'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/customers:
    get:
      tags:
        - Reports
      summary: 'Facility report'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/inspections:
    get:
      tags:
        - Reports
      summary: 'Inspection report'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/inspections/status-summary:
    get:
      tags:
        - Reports
      summary: 'Pending, completed and overdue inspection totals'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/maintenance:
    get:
      tags:
        - Reports
      summary: 'Maintenance report'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/maintenance/frequency:
    get:
      tags:
        - Reports
      summary: 'Maintenance frequency report'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/compliance:
    get:
      tags:
        - Reports
      summary: 'Compliance report'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/inventory/summary:
    get:
      tags:
        - Reports
      summary: 'Daily, monthly and yearly inventory summary'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/summary:
    get:
      tags:
        - Reports
      summary: 'Dashboard summary'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
  /reports/audit:
    get:
      tags:
        - Reports
      summary: 'Audit report'
      parameters:
        -
          in: query
          name: page
          schema: {type: integer, default: 1}
          description: 'Page number'
        -
          in: query
          name: limit
          schema: {type: integer, default: 10}
          description: 'Number of items'
